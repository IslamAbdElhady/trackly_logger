name: trackly_logger
description: A lightweight, zero-dependency logger for Dart and Flutter with log levels, colored output, tags, and clickable links to the line of code that wrote each log.
version: 0.2.0
repository: https://github.com/IslamAbdElhady/trackly_logger
issue_tracker: https://github.com/IslamAbdElhady/trackly_logger/issues

topics:
  - logging
  - logger
  - debugging
  - console

environment:
  sdk: ^3.7.0

dev_dependencies:
  lints: '>=5.1.1 <7.0.0'
  test: ^1.25.0
